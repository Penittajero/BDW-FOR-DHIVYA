<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blow the Candle 🎂</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    margin:0;
    font-family:Poppins,sans-serif;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    flex-direction:column;
    overflow:hidden;
    text-align:center;
}

h1{
    color:white;
    margin-bottom:20px;
}

.candle{
    font-size:120px;
    cursor:pointer;
    transition:.5s;
}

button{
    margin-top:30px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    background:#ff4081;
    color:white;
}
</style>

</head>
<body>

<h1>🎂 Make a Wish & Blow the Candle 🎂</h1>

<div class="candle" onclick="blow()">
🕯️
</div>

<p id="msg"></p>

<button onclick="window.location.href='index.html'">
🏠 Back Home
</button>

<script>
function blow(){
    document.querySelector(".candle").innerHTML="💨";
    document.getElementById("msg").innerHTML=
    "<h2>🎉 Happy Birthday Dhivya! ❤️</h2>";
}
</script>

</body>
</html>
